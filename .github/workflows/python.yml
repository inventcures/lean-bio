name: python

on:
  push:
    paths:
      - "bsl/**"
      - "tests/**"
      - "examples/**"
      - "pyproject.toml"
      - "lean/lean-toolchain"
      - ".github/workflows/python.yml"
  pull_request:
    paths:
      - "bsl/**"
      - "tests/**"
      - "examples/**"
      - "pyproject.toml"
      - "lean/lean-toolchain"
      - ".github/workflows/python.yml"
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Lean core (no Mathlib) so the `omega` tests run instead of skipping.
      - name: Install the pinned Lean toolchain
        if: runner.os == 'Linux'
        run: |
          curl -fsSL https://elan.lean-lang.org/elan-init.sh \
            | sh -s -- -y --default-toolchain "$(cat lean/lean-toolchain)"
          echo "BSL_LEAN=$HOME/.elan/bin/lean" >> "$GITHUB_ENV"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q -rs
